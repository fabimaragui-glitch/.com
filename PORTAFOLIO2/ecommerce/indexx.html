<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio de Sesión</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#ffffff,#ffffff);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-card{
    width:100%;
    max-width:400px;
    border-radius:15px;
}

.login-title{
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<div class="card shadow login-card p-4">

<h3 class="login-title mb-4">Bienvenido</h3>
<p class="text-center text-muted">Inicia sesión con tu correo</p>


<form action="index.html">

<div class="mb-3">
<label class="form-label">Correo electrónico</label>
<input type="email" class="form-control" placeholder="ejemplo@email.com" maxlength="50">
</div>

<div class="mb-3">
<label class="form-label">Contraseña</label>
<input type="password" class="form-control" placeholder="Contraseña" maxlength="12">
<div class="form-text">Máximo 12 caracteres</div>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-danger">Iniciar sesión</button>
</div>

<div class="text-center mt-3">
<a href="#">¿Olvidaste tu contraseña?</a>
</div> 

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
